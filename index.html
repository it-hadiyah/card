<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5b4d">
  <meta name="description" content="بطاقة الاتصال الرسمية للأستاذ علاء بن علي القباص، الرئيس التنفيذي لشركة هدية الخير">
  <title>علاء بن علي القباص | بطاقة الاتصال</title>
  <style>
    :root{color-scheme:light;--green:#0b5b4d;--gold:#be9b5a;--ink:#18342e;--muted:#62746d}
    *{box-sizing:border-box}html{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
    body{min-height:100svh;margin:0;background:linear-gradient(150deg,#eaf2ed,#f9f8f3);color:var(--ink);display:grid;place-items:center;padding:24px 15px}
    main{width:min(100%,420px);border-radius:24px;overflow:hidden;background:white;box-shadow:0 18px 54px #0b5b4d19}
    .head{background:var(--green);color:white;text-align:center;padding:33px 22px 38px;position:relative}
    .head::after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--gold)}
    .mark{display:inline-grid;place-items:center;border:1px solid #ffffff55;border-radius:14px;width:54px;height:54px;font-size:24px;font-weight:750;color:#e5c48b;margin-bottom:17px}
    h1{font-size:25px;line-height:1.4;margin:0 0 7px;font-weight:750}
    .position{font-size:15px;margin:0 0 6px;color:#f4e7c7}
    .company{font-size:13px;margin:0;color:#dcece5}
    .content{padding:25px 24px 28px}
    .row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e9eee9;text-decoration:none;color:var(--ink);min-width:0}
    .row:last-of-type{border-bottom:0}
    .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#eaf3ef;color:var(--green);font-size:18px;flex-shrink:0}
    .meta{min-width:0}.label{font-size:12px;color:var(--muted);margin-bottom:4px}.value{font-size:14px;font-weight:600;overflow-wrap:anywhere;direction:ltr;text-align:right}
    .save{margin-top:23px;display:flex;justify-content:center;align-items:center;gap:9px;background:var(--green);color:white;text-decoration:none;font-size:16px;font-weight:700;border-radius:14px;padding:17px 12px;min-height:54px}
    .save:focus-visible,.row:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    .note{text-align:center;font-size:12px;line-height:1.8;color:var(--muted);margin:13px 4px 0}
    footer{text-align:center;padding:0 18px 24px;font-size:11px;color:#86948c}
  </style>
</head>
<body>
  <main>
    <header class="head">
      <div class="mark" aria-hidden="true">هـ</div>
      <h1>علاء بن علي القباص</h1>
      <p class="position">الرئيس التنفيذي</p>
      <p class="company">شركة هدية الخير</p>
    </header>
    <section class="content" aria-label="معلومات التواصل">
      <a class="row" href="tel:+966590999900">
        <span class="ico" aria-hidden="true">☎</span>
        <span class="meta"><div class="label">رقم الجوال</div><div class="value" dir="ltr">+966 59 099 9900</div></span>
      </a>
      <a class="row" href="mailto:a.algabbas@hak.com.sa">
        <span class="ico" aria-hidden="true">✉</span>
        <span class="meta"><div class="label">البريد الإلكتروني</div><div class="value" dir="ltr">a.algabbas@hak.com.sa</div></span>
      </a>
      <a class="save" href="./Alaa_AlQabbas_Contact.vcf" type="text/vcard" aria-label="تنزيل بطاقة جهة الاتصال لإضافتها إلى جهات الاتصال">＋ حفظ جهة الاتصال</a>
      <p class="note">اضغط على الزر، ثم افتح ملف جهة الاتصال واختر إضافتها إلى جهات الاتصال. قد يختلف العرض بين iPhone وAndroid.</p>
    </section>
    <footer>بطاقة اتصال رقمية • شركة هدية الخير</footer>
  </main>
</body>
</html>
